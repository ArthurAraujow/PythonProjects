<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man (1980)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cabinet">
        <!-- Arcade Header & Scoreboard -->
        <div class="score-bar">
            <div class="score-col">
                <span class="label">1UP</span>
                <span id="score-val" class="val">00</span>
            </div>
            <div class="score-col center">
                <span class="label">HIGH SCORE</span>
                <span id="high-score-val" class="val">10000</span>
            </div>
            <div class="cabinet-actions">
                <button id="sound-btn" class="arcade-toggle">[ SOM: ON ]</button>
                <button id="pause-btn" class="arcade-toggle">[ PAUSAR ]</button>
            </div>
        </div>

        <!-- Tela Principal do Jogo (Canvas) -->
        <div class="screen-frame" id="screen-frame">
            <canvas id="gameCanvas" width="448" height="496"></canvas>
        </div>

        <!-- Rodapé do Arcade: Vidas & Frutas -->
        <div class="status-bar">
            <div id="lives-display" class="lives-box"></div>
            <div id="fruit-display" class="fruit-box"></div>
        </div>

        <!-- Controles para Dispositivos Touch -->
        <div class="touch-controls">
            <div class="dpad">
                <button class="dpad-btn up" data-dir="up">▲</button>
                <div class="dpad-row">
                    <button class="dpad-btn left" data-dir="left">◀</button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn right" data-dir="right">▶</button>
                </div>
                <button class="dpad-btn down" data-dir="down">▼</button>
            </div>
        </div>

        <div class="footer-hint">
            SETAS OU WASD PARA MOVER &bull; ESPAÇO PARA PAUSAR
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
